[package]
name = "rustic-csv-splitter"
version = "0.1.2"
edition = "2021"

[dependencies]
anyhow = " 1.0.100"
clap = { version = "4.5.48", features = ["derive"] }
csv = "1.3.1"
csv-async = "1.3.1"
dashmap = "6.1.0"
futures = "0.3.31"
rayon = "1.11.0"
tokio = { version = "1.47.1", features = ["full"] }
thiserror = "2.0.16"
tracing = "0.1.41"
tracing-subscriber = "0.3.20"
